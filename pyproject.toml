[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# E = pycodestyle errors, F = pyflakes, I = import sorting
select = ["E", "F", "I"]
ignore = ["E501"]  # Let Black handle line length

[tool.ruff.lint.isort]
combine-as-imports = true
